function applyTheme(theme,save=false){
 currentTheme=theme==='night'?'night':'day';
 document.documentElement.dataset.theme=currentTheme;
 document.querySelector('meta[name="theme-color"]').content=currentTheme==='night'?'#0b0d18':'#ffffff';
 document.querySelectorAll('.theme-switch button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.theme===currentTheme)));
 const hero=document.querySelector('.hero-art');
 if(hero){const art=themeArtwork[currentTheme];if(hero.getAttribute('src')!==art.src)hero.src=art.src;hero.alt=art.alt;}
 if(save){try{localStorage.setItem(themeStorageKey,currentTheme);}catch{toast('Theme changed. This browser could not save the preference.');}}
}
window.addEventListener('storage',event=>{if(event.key===themeStorageKey)applyTheme(event.newValue);});
const frameCorners='<span class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';

function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),3500);}
function render(){if(view==='map')renderMap();else if(view==='topic')renderTopic();else if(view==='links')renderLinks();else if(view==='showcase')renderShowcase();else renderRoom();}
function renderMap(){app.innerHTML=`<section class="home"><div class="home-feature">${frameCorners}<div class="hero-visual"><img class="hero-art" src="${themeArtwork[currentTheme].src}" alt="${themeArtwork[currentTheme].alt}" fetchpriority="high"></div><div class="hero-copy"><h1 class="talk-title">Intelligence by Permission, Jensen &amp; the Cypherpunks, Staying (Alive) Sovereign</h1><p class="event-hosts">Hosted by <a class="host-profile" href="https://x.com/proof_of_nick" target="_blank" rel="noopener noreferrer"><strong>Nicholas George</strong></a> &amp; <a class="host-profile" href="https://x.com/conorokus" target="_blank" rel="noopener noreferrer"><strong>Conor Okus</strong></a></p><p class="intro"><em>Fear, elections, and cyber anxiety are shaping the fight to control intelligence. The fight for open intelligence is about a future you control, and keeping that control in a world that keeps getting hacked.</em></p><p class="event-visit-links"><a href="https://luma.com/8e5ttp0b" target="_blank" rel="noopener noreferrer">Invite Link <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M7 17 17 7M7 7h10v10"/></svg></a><a href="https://www.google.com/maps/dir/?api=1&amp;destination=400%20NW%2026th%20Street%2C%20Miami%2C%20Florida" target="_blank" rel="noopener noreferrer" aria-label="Directions to 400 NW 26th Street, Miami, Florida" title="400 NW 26th Street, Miami, Florida">Directions <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M7 17 17 7M7 7h10v10"/></svg></a></p><div class="event-sponsor"><span class="sponsor-label">Sponsored by</span><a href="https://vora.io/" target="_blank" rel="noopener noreferrer"><img src="/dist/assets/logos/vora.svg" alt="" width="54" height="28"><span>vora.io</span><span class="sponsor-arrow" aria-hidden="true">↗</span></a></div><div class="home-buttons"><button class="primary home-action home-action--room" data-action="opening">Read the Room <span class="arrow">↗</span></button><button class="primary home-action home-action--points" data-action="topic" data-index="0">Discussion Points <span class="arrow">↗</span></button></div></div></div><div class="topic-map">${frameCorners}${topics.map((t,i)=>`<button class="topic-row" data-action="topic" data-index="${i}"><span class="number ${state.visited.includes(t.id)?'visited':''}"><span class="number-glyph">${['I','II','III','IV','V'][i]}</span></span><span><h2>${t.title}</h2><p>${t.subtitle}</p></span><span class="arrow">↗</span></button>`).join('')}<button class="topic-row" data-action="showcase"><span class="number"><span class="number-glyph">VI</span></span><span><h2>Showcase</h2><p>Vora · Spiral · Miami Builders · Product Demos</p></span><span class="arrow">↗</span></button><div class="map-caption"><button class="map-links" data-action="links">All links ↗</button></div></div></section>`;}
function sourceLinks(c,ids=c.evidence,label=`Sources for ${c.title}`){return ids.length?`<nav class="source-list" aria-label="${esc(label)}">${ids.map(id=>{const source=sources[id];return `<a class="source-link" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer"><span class="source-title">${esc(source.title)}</span><span class="source-format">${esc(source.format)}</span><span class="source-arrow" aria-hidden="true">↗</span></a>`;}).join('')}</nav>`:'';}
function sectionNav(){return `<nav class="topic-nav${view==='links'?' links-nav':''}" aria-label="Discussion areas, showcase, and links">
  <button class="back" data-action="map">← All questions</button>
  ${topics.map((t,i)=>`<button data-action="topic" data-index="${i}" class="${view==='topic'&&i===topicIndex?'active':''}" ${view==='topic'&&i===topicIndex?'aria-current="page"':''}>${String(i+1).padStart(2,'0')} &nbsp; ${t.word}</button>`).join('')}
  <button data-action="showcase" class="${view==='showcase'?'active':''}" ${view==='showcase'?'aria-current="page"':''}>06 &nbsp; Showcase</button>
  <button data-action="links" class="${view==='links'?'active':''}" ${view==='links'?'aria-current="page"':''}>07 &nbsp; Links</button>
</nav>`;}
function renderShowcase(){
  app.innerHTML=`${sectionNav()}
    <section class="links-shell showcase-shell" aria-labelledby="showcase-title">
      <div class="links-heading"><div><div class="eyebrow">06 · Showcase</div><h1 id="showcase-title">Sponsors &amp; Showcase</h1></div></div>
      ${showcaseGroups.map(group=>`<section class="showcase-group showcase-group--${esc(group.id)}" aria-labelledby="showcase-group-${esc(group.id)}">
      <div class="showcase-group-heading"><h2 id="showcase-group-${esc(group.id)}">${esc(group.title)}</h2>${group.description?`<p>${esc(group.description)}</p>`:''}</div>
      <div class="showcase-grid">${group.sourceIds.map(id=>{const source=sources[id];return `<article class="showcase-entry${group.id==='sponsors'?'':' showcase-feature'}" aria-labelledby="showcase-${id}">
        ${frameCorners}
        <h3 id="showcase-${id}"><a class="showcase-title${source.logo?'':' showcase-title--text'}" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${source.logo?`<span class="showcase-logo showcase-logo--${esc(source.logoTone)}" aria-hidden="true"><img src="/dist/assets/logos/${esc(source.logo)}" alt="" width="54" height="54" decoding="async"></span>`:''}<span class="showcase-name">${esc(source.showcaseTitle||source.title)}</span><span class="showcase-arrow" aria-hidden="true">↗</span></a></h3>
        <p class="showcase-summary">${esc(source.summary)}</p>
      </article>`;}).join('')}</div>
      </section>`).join('')}
    </section>`;
}
function renderLinks(){
  const groups=topics.map(t=>({...t,cases:[...t.cases.flatMap(c=>[
    {...c,evidence:c.evidence},
    ...(c.risks?.length?[{label:`${c.label} · Risks`,evidence:c.risks}]:[])
  ]),...(additionalReading[t.id]?.length?[{label:'Further Reading',evidence:additionalReading[t.id]}]:[])]}));
  groups.push({id:'showcase',word:'Showcase',cases:showcaseGroups.map(g=>({label:g.title,evidence:g.sourceIds}))});
  const count=new Set(groups.flatMap(t=>t.cases.flatMap(c=>c.evidence)).map(id=>sources[id].url.replace(/\/$/,''))).size;
  app.innerHTML=`${sectionNav()}
    <section class="links-shell" aria-labelledby="links-title">
      <div class="links-heading"><div><div class="eyebrow">The source collection</div><h1 id="links-title">Links</h1><p>Discussion sources and further reading from this month, grouped by theme.</p></div><span class="eyebrow">${count} unique links · ${groups.length} sections</span></div>
      ${groups.map((t,i)=>`<section class="links-section" aria-labelledby="links-${t.id}">
        <div class="links-section-heading"><span class="links-numeral" aria-hidden="true">${['I','II','III','IV','V','VI'][i]}</span><h2 id="links-${t.id}">${esc(t.word)}</h2><span class="eyebrow">${t.cases.reduce((sum,c)=>sum+c.evidence.length,0)} links</span></div>
        <table class="links-table" role="table" aria-label="${esc(t.word)} sources and summaries">
          <colgroup><col class="links-title-column"><col></colgroup>
          <thead><tr><th scope="col">Link</th><th scope="col">What it covers</th></tr></thead>
          ${t.cases.map(c=>`<tbody>
            <tr class="links-case-heading"><th colspan="2" scope="rowgroup">${esc(c.label)}</th></tr>
            ${c.evidence.map(id=>{const source=sources[id];return `<tr class="links-entry">
              <th scope="row"><a class="source-link" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer"><span class="source-title">${esc(source.title)}</span><span class="source-arrow" aria-hidden="true">↗</span></a><span class="source-format">${esc(source.format)}</span></th>
              <td class="link-summary">${esc(source.summary)}</td>
            </tr>`;}).join('')}
          </tbody>`).join('')}
        </table>
      </section>`).join('')}
    </section>`;
}
function sourcePreview(c){
  const preview=c.preview;
  if(!preview)return '';
  const source=preview.source?sources[preview.source]:null;
  const visual=`<span class="preview-image preview-${esc(preview.fit||'cover')}"><img src="${esc(preview.src)}" alt="${esc(preview.alt)}" decoding="async">${preview.kind==='video'?'<span class="preview-play" aria-hidden="true">▶</span>':''}</span><span class="preview-caption">${esc(preview.caption)}${source?'<span aria-hidden="true">↗</span>':''}</span>`;
  return source?`<a class="source-preview" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(source.title)}: open ${esc(preview.kind==='video'?'video':'source')} in a new tab">${visual}</a>`:`<figure class="source-preview preview-concept">${visual}</figure>`;
}
function topicHeading(t,focused=false){return `<div class="topic-heading"><div><div class="eyebrow accent">${['I','II','III','IV','V'][topicIndex]} / ${esc(t.word)}${focused?' / Focus':''}</div><h1 id="topic-title" tabindex="-1">${esc(focused?currentCase().label:t.title)}</h1>${!focused&&t.intro?`<p class="topic-intro"><em>${esc(t.intro)}</em></p>`:''}</div>${focused?'<button class="overview-back" data-action="overview">← All three topics</button>':''}</div>`;}
function topicNews(t){
  if(!t.news)return '';
  const source=sources[t.news.source];
  return `<aside class="topic-news" aria-label="${esc(t.news.label)}"><span class="eyebrow">${esc(t.news.label)}</span><p><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(t.news.text)} <span aria-hidden="true">↗</span></a> <span>${esc(t.news.question)}</span></p></aside>`;
}
function casePrinciple(c){
  if(!c.principle)return '';
  return `<figure class="case-principle" aria-label="Roundtable privacy principle"><blockquote><p>“${esc(c.principle.text)}”</p></blockquote><figcaption>${esc(c.principle.caption)}</figcaption></figure>`;
}
function renderTopic(){
  const t=currentTopic();
  if(focusedCaseId){renderFocusedTopic();return;}
  app.innerHTML=`${sectionNav()}<section class="topic-shell topic-overview" aria-labelledby="topic-title">
    ${topicHeading(t)}
    <div class="topic-overview-grid">${t.cases.map((c,i)=>`<article class="overview-card" style="--overview-source-count:${c.overviewSourceCount||3}" aria-labelledby="card-${esc(c.id)}">${frameCorners}
      <div class="overview-card-top"><span class="overview-numeral" aria-hidden="true">${['I','II','III'][i]}</span>${sourcePreview(c)}</div>
      <h2 id="card-${esc(c.id)}">${esc(c.label)}</h2>
      <p class="overview-summary">${esc(c.overview||c.body)}</p>
      <div class="overview-discussion"><p class="overview-question">${esc(c.questions[0])}</p>${casePrinciple(c)}</div>
      <div class="overview-card-bottom">
        ${sourceLinks(c,c.evidence.slice(0,c.overviewSourceCount||3),`Featured sources for ${c.label}`)}
        <button class="overview-focus" data-action="case" data-id="${esc(c.id)}" aria-label="Focus ${esc(c.focusLabel||c.label)}"><span>Focus ${esc(c.focusLabel||c.label)}</span><span aria-hidden="true">↗</span></button>
      </div>
    </article>`).join('')}</div>
    ${topicNews(t)}
  </section>`;
}
function renderFocusedTopic(){
  const t=currentTopic(),c=currentCase();
  app.innerHTML=`${sectionNav()}<section class="topic-shell topic-focus" aria-labelledby="topic-title">
    ${topicHeading(t,true)}
    <div class="discussion">
        <article class="context">${frameCorners}
          <div class="case-meta"><span class="case-type">${c.type}</span><span>${c.date}</span></div>
          <div class="context-heading"><h2>${c.title}</h2>${sourcePreview(c)}</div>
          <p class="capsule">${c.body}</p>
          ${casePrinciple(c)}
          ${c.quotes?.length?`<div class="context-quotes" aria-label="In DHH’s words">${c.quotes.map(quote=>{const source=sources[quote.source];return `<figure class="context-quote"><blockquote cite="${esc(source.url)}"><p>“${esc(quote.text)}”</p></blockquote><figcaption><cite><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)} <span aria-hidden="true">↗</span></a></cite></figcaption></figure>`;}).join('')}</div>`:''}
          ${c.takeaways?.length?`<section class="summit-takeaways" aria-labelledby="takeaways-title"><h3 id="takeaways-title" class="eyebrow">Five Priorities From the Summit</h3><ol>${c.takeaways.map(point=>`<li><strong>${esc(point.title)}.</strong> <span>${esc(point.body)}</span></li>`).join('')}</ol></section>`:''}
          ${c.discussionPoints?.length?`<ul class="discussion-points">${c.discussionPoints.map(point=>`<li>${esc(point)}</li>`).join('')}</ul>`:''}
          ${sourceLinks(c)}${c.caveat?`<p class="source-context-note">${esc(c.caveat)}</p>`:''}
          ${c.risks?.length?`<section class="risk-sources" aria-labelledby="risk-title"><h3 id="risk-title" class="eyebrow">Risks</h3>${sourceLinks(c,c.risks,`Risks and access terms for ${c.title}`)}</section>`:''}
        </article>
      <article class="question-card topic-focus-questions" aria-label="Discussion prompts">${frameCorners}
        ${c.questions.map((question,i)=>`<section class="focus-prompt${i===0?' focus-prompt-opening':''}" aria-labelledby="focus-question-${i}">
          <div class="eyebrow">${['Starting Point','Bigger Questions','Build Opportunities'][i]}</div>
          <h2 id="focus-question-${i}">${esc(question)}</h2>
          <p class="focus-nudge">${esc(c.nudges[i])}</p>
        </section>`).join('')}
      </article>
    </div>
    <div class="discussion-footer"><p class="context-primer"><span class="eyebrow">In plain language</span>${esc(t.term)}</p></div>
  </section>`;
}
function openCase(id){
  if(view!=='topic'||!currentTopic().cases.some(c=>c.id===id))return;
  focusedCaseId=id;
  state.selected[currentTopic().id]=id;
  persist();render();
  window.scrollTo(0,0);
  app.querySelector('#topic-title')?.focus({preventScroll:true});
}
function showOverview(){
  const previous=focusedCaseId;
  focusedCaseId=null;render();
  const button=app.querySelector(`[data-action="case"][data-id="${previous}"]`);
  button?.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function renderRoom(){const closing=view==='closing',key=closing?'after':'before',value=state.mood[key];app.innerHTML=`<section class="room"><div class="room-head"><span class="eyebrow accent">${closing?'Back to where we started':'Before we begin'} / A show of hands</span><button class="text-link" data-action="map">← Discussion map</button></div>${closing?'':`<figure class="room-art"><img src="/assets/local-ai-read-the-room.png" alt="Satirical illustration contrasting a relaxed local AI community above the clouds with closed AI platforms and frustrated users below." width="1536" height="1024"></figure>`}<h1>${closing?'What changed your <span class="serif">mind?</span>':'How are we <span class="serif">feeling?</span>'}</h1>${closing?'<p class="room-prompt">Which example shifted your view? What is one thing you want to test next?</p>':''}<div class="spectrum-labels"><span>“It’s so over.”</span><span>“We’re so back.”</span></div><div class="spectrum" role="group" aria-label="Room sentiment">${moodLabels.map((label,i)=>`<button class="${value===i?'selected':''}" data-action="mood" data-index="${i}" aria-pressed="${value===i}"><span class="dot" aria-hidden="true"></span>${label}</button>`).join('')}</div><p class="room-caption">A shared impression of the room · no votes are counted. Select again to clear.</p><div class="room-bottom">${closing?`<div class="comparison">${(state.mood.before===null?'Opening mood wasn’t recorded.':`We started: <strong>${moodLabels[state.mood.before]}</strong>`) +(value!==null?` &nbsp;→&nbsp; Now: <strong>${moodLabels[value]}</strong>`:'')}</div>`:''}<button class="primary" data-action="map">${closing?'Back to the discussion':'Choose our first question'} <span class="arrow">↗</span></button></div>${closing?`<div class="closing-prompts"><div class="eyebrow">One insight. One unresolved question. One experiment.</div></div>`:''}</section>`;}
function navigate(next,index){
  view=next;
  try{history.replaceState(null,'',location.pathname+location.search+(['links','showcase'].includes(next)?'#'+next:''));}catch{}
  focusedCaseId=null;
  if(next==='topic'){
    topicIndex=Math.max(0,Math.min(4,index));
    const id=currentTopic().id;
    if(!state.visited.includes(id))state.visited.push(id);
    persist();
  }
  render();
  window.scrollTo(0,0);
}
function openDialog(title,html){restoreFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;}
function focusSources(){const link=app.querySelector('.source-link');if(link){link.focus();link.scrollIntoView({block:'nearest'});}}
function help(){openDialog('Follow the discussion.',`<p>Each area opens with three topics and three source links per topic. Choose Focus for the full context, all sources and discussion prompts. Return to the overview whenever the room changes direction.</p><div class="key-list"><span><kbd>M</kbd></span><span>Return to the discussion map</span><span><kbd>1</kbd> – <kbd>5</kbd></span><span>Open a discussion area’s overview</span><span><kbd>6</kbd></span><span>Open the showcase</span><span><kbd>7</kbd></span><span>Open all links</span><span><kbd>E</kbd></span><span>Focus the first source link on the page</span><span><kbd>F</kbd></span><span>Toggle fullscreen</span><span><kbd>Esc</kbd></span><span>Return from Focus to the three-topic overview</span></div>`);}

async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Use your browser’s fullscreen command.');}catch{toast('Use your browser’s fullscreen command.');}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,index=Number(b.dataset.index);switch(a){case'theme':applyTheme(b.dataset.theme,true);break;case'map':navigate('map');break;case'links':navigate('links');break;case'showcase':navigate('showcase');break;case'topic':navigate('topic',index);break;case'case':openCase(b.dataset.id);break;case'overview':showOverview();break;case'opening':navigate('opening');break;case'closing':navigate('closing');break;case'mood':{const key=view==='closing'?'after':'before';state.mood[key]=state.mood[key]===index?null:index;persist();render();break;}case'help':help();break;case'close-dialog':dialog.close();break;case'fullscreen':fullscreen();break;}});
dialog.addEventListener('close',()=>{restoreFocus?.isConnected&&restoreFocus.focus();});
document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'↙ Exit fullscreen':'⛶ Fullscreen';document.getElementById('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(dialog.open)return;const k=e.key.toLowerCase();if(k==='m')navigate('map');else if(k==='6')navigate('showcase');else if(k==='7')navigate('links');else if(/^[1-5]$/.test(k))navigate('topic',Number(k)-1);else if(k==='f')fullscreen();else if(k==='?')help();else if(view==='topic'){if(k==='e')focusSources();else if(k==='escape'&&focusedCaseId){e.preventDefault();showOverview();}}});
window.addEventListener('storage',event=>{if(event.key!==storageKey)return;try{const incoming=JSON.parse(event.newValue);if(incoming&&Array.isArray(incoming.visited)){state={...defaults(),...incoming};render();}}catch{}});
window.addEventListener('hashchange',()=>{view=hashView();focusedCaseId=null;render();window.scrollTo(0,0);});
applyTheme(currentTheme);render();
</script>
</body>
</html>
