 karpathygap:{"format":"Post · X","title":"Karpathy · The Widening AI Perception Gap","date":"October 11, 2026","url":"https://x.com/karpathy/status/2109361546505966046","note":"Karpathy argues that casual users, people working with frontier tools and researchers can have very different views of AI capability. His population estimates are explicitly rough napkin math, not survey data. The preview is a conceptual illustration, not his chart.","summary":"Karpathy argues that people’s understanding of AI is diverging as their tools, use cases and depth of experience differ."},
 loupe:{"format":"Project overview","title":"Project Loupe · AI Security for Bitcoin","date":"Project background · checked October 28, 2026","url":"https://www.projectloupe.org/about","note":"Spiral and Block describe responsible disclosure and funded scans for participating open-source Bitcoin projects. People running the tool independently provide their own model access and tokens. Scanning cannot establish that code is free of vulnerabilities.","summary":"Spiral and Block’s Loupe helps open-source Bitcoin maintainers find and fix vulnerabilities with AI-assisted scanning."},
 rea:{"format":"GitHub","title":"REA · Reverse Engineer Anything","date":"Repository · checked October 27, 2026","url":"https://github.com/morluto/rea","note":"The official morluto/rea repository connects agents to established analysis tools, including Ghidra, Hopper and IDA, for inspecting binaries and other software. Local analysis can reveal behavior without original source code, but results need verification. This does not make every program reconstructable or turn proprietary code into open-source software; the model provider and where inference runs remain separate choices.","summary":"REA connects AI agents to analysis tools for inspecting compiled programs and other software without the original source code."},
 samsungrea:{"format":"X · Research claim","title":"log4j · Samsung TV investigation","date":"October 21, 2026","url":"https://x.com/log4j/status/2113014142600953868","note":"log4j reports accessing a 2025 Samsung TV’s firmware and finding tracking, advertising and microphone-related capabilities. Follow-up posts describe always-on voice functionality and network mapping. These are the researcher’s claims, not an independently reproduced audit. This thread does not establish a complete path from ambient conversation to Instagram advertising, access to arbitrary nearby microphones, or that REA specifically was used.","summary":"log4j reports tracking and microphone-related capabilities in Samsung TV firmware, raising questions about what owners can verify."},
 reaban:{"format":"X · User report","title":"log4j · Reported OpenAI ban","date":"October 23, 2026","url":"https://x.com/log4j/status/2113647464154857840","note":"log4j reports an OpenAI account ban and attributes it to local reverse-engineering work. He says he did not use OpenAI to exploit or find vulnerabilities. The post does not establish the full activity reviewed by the provider, the exact trigger, or that the Samsung investigation caused the suspension.","summary":"log4j reports an OpenAI account ban that he attributes to local reverse-engineering work; the precise trigger is unconfirmed."},
 reaclaude:{"format":"X · Claim","title":"Claude · Reported REA restrictions","date":"October 23, 2026","url":"https://x.com/0x0SojalSec/status/2113751276320399694","note":"Md Ismail Sojal claims Claude’s reverse-engineering assistance became restricted after the Samsung story circulated. This is a public report and interpretation, not an Anthropic announcement or proof of a blanket ban, coordinated action, or a causal link to Samsung. Use it to discuss reliance on a provider-controlled auditing tool.","summary":"Md Ismail Sojal claims Claude restricted REA-style assistance, prompting debate about provider control of auditing tools."},
 samsungacr:{"format":"Vendor explainer","title":"Samsung · Viewing data & ACR controls","date":"Support page · checked October 27, 2026","url":"https://www.samsung.com/us/support/answer/ANS10010616/","note":"Samsung describes Automatic Content Recognition as optional viewing-data collection that includes programs watched, viewing duration, TV identifiers and IP addresses. It says users must opt in and can turn it off in settings. This is the vendor’s stated behavior and controls, not independent validation of the firmware investigation or an explanation of ambient microphone behavior.","summary":"Samsung explains its viewing-data collection through ACR and says users can opt in or disable it in TV settings."},
 wavelength:{"format":"Announcement","title":"Lightning Labs · Wavelength on mainnet","date":"October 23, 2026","url":"https://lightning.engineering/posts/2026-10-23-wavelength-mainnet-launch/","note":"Lightning Labs opens Wavelength to everyone on mainnet, describing agent payments through MCP and L402 without running a Lightning node. The release includes receive-only credentials and keeps wallet creation and unlocking outside the agent channel. It remains an alpha, with fees and balance limits; the announcement does not establish widespread adoption.","summary":"Lightning Labs opens Wavelength on mainnet for agents to pay and get paid in bitcoin for APIs, data and services."},
 grokbank:{"format":"X · User report","title":"Grok Bot · Bank details sent to Slack","date":"October 6, 2026","url":"https://x.com/ShaneMac/status/2107486740491669879","note":"Shane Mac reports that a Grok Bot financial agent posted his private bank balances and expense audit into his company’s Slack. His thread names Grok Bot, not Muse, and describes connections shared between agents. This is his account, not an independently reproduced incident or a confirmed root-cause analysis. Mac is also building agent-permissions tooling.","summary":"Shane Mac reports that his Grok Bot shared private bank balances and an expense audit in his company’s Slack."},
 harkpizza:{"format":"X · Video","title":"Hark · The $1M pizza giveaway","date":"October 16, 2026","url":"https://x.com/adcock_brett/status/2111224226808311906","note":"Hark founder Brett Adcock announces $1 million in free pizza through the Hark app, first-come and U.S. only. This establishes the promotion, not what data any particular account accessed. Read alongside the user report and the offer terms.","summary":"Brett Adcock announces Hark’s $1 million free-pizza promotion to get people trying its assistant."},
 harkgmail:{"format":"X · User report","title":"Hark · A pizza order, a Gmail profile","date":"October 16, 2026","url":"https://x.com/SebastianGallic/status/2111260563263103215","note":"Sebastian Gallic says he connected Gmail for the pizza offer and the assistant then described information about his family, friends, businesses, travel and other habits. The post includes a screenshot and quotes the promotion. This is a reported experience; it does not establish that every email was read, that data was sold, or the company’s intent.","summary":"Sebastian Gallic reports that connecting Gmail for a pizza order led Hark to profile his relationships, businesses and habits."},
 harkterms:{"format":"Offer terms","title":"Hark · Pizza & email-access terms","date":"Updated October 15, 2026","url":"https://hark.com/pizza","note":"The offer terms describe a $30 DoorDash credit, say connecting email is optional, and state that account access is limited to completing the offer. These are Hark’s stated terms, not verification of the user’s experience. Compare the access requested, the task’s needs and what the agent actually does.","summary":"Hark’s pizza terms say email connection is optional and account access is limited to fulfilling the offer."},
 indexOriginal:{"format":"Link","title":"Index Network · Original brainstorm link","date":"Supplied during preparation","url":"https://index.network/l/088436b1-bafe-4f96-a2e0-4d2a149fa692","note":"The original discussion link supplied in the brainstorm. Its contents could not be inspected during preparation.","summary":"The original Index discussion link shared for the event, whose contents have not been verified."},
 summit:{"format":"Agenda","title":"Open Source AI Summit · agenda","date":"September 10–11, 2026","url":"https://opensourceaisummit.org/","note":"The organizer lists David Sacks, Michael Millerman and Vora, alongside sessions on open models, local inference, safety and the right to compute.","summary":"The summit agenda brings together speakers on open models, local inference, safety and the right to compute."},
 vora:{"format":"Video","title":"Vora Aegis · The summit presentation","date":"Recorded September 2026","url":"https://www.youtube.com/watch?v=3t5N8C1pU0c","note":"Vora’s presentation of Aegis: a local personal AI appliance. Vora’s product site lists Spring 2027 availability. The demo is one example in the wider personal-assistant discussion; loyalty and privacy are product propositions.","summary":"Vora presents Aegis, its proposed local AI appliance for personal data and assistance."},
 underdog:{"format":"Website","title":"Underdog · AI on your own devices","date":"Invite-only beta · checked October 27, 2026","url":"https://underdog.ai/","note":"Conway’s personal assistant offers email, calendar, meeting notes and errands with local AI processing and editable memory. Its live product page lists an invite-only beta for Mac and Windows; iPhone and iPad are coming soon. These are the maker’s product claims.","summary":"Underdog presents an assistant that runs locally and helps with email, calendars, meeting notes and errands."},
 ghost:{"format":"Website","title":"Ghost Core · A personal AI computer","date":"First batch open · checked October 27, 2026","url":"https://ghost.ai/","note":"Ghost presents Core as dedicated hardware running models on device, with ongoing personal context and proactive assistance. Its product page has first-batch orders open. Ordering availability and the company’s privacy claims do not establish delivery or independently verified performance.","summary":"Ghost introduces Core, a dedicated AI computer designed to build personal context and offer proactive help."},
 hark:{"format":"Website","title":"Hark Pro · Personal AI assistant","date":"Product page · checked October 27, 2026","url":"https://hark.com/","note":"Hark’s homepage presents a personal assistant with persistent memory, proactive suggestions and Handoff, a cloud computer for web tasks. It describes encrypted credentials and approval controls. These are the provider’s product claims.","summary":"Hark presents a personal assistant with memory, suggested actions and a cloud computer for handling web tasks."},
 hf:{"format":"Disclosure","title":"Hugging Face · security incident disclosure","date":"July 16, 2026","url":"https://huggingface.co/blog/security-incident-july-2026","note":"Hugging Face reports an autonomous-agent intrusion, compromised internal credentials and datasets, and no evidence of tampering with public models, datasets or Spaces. Its account also describes using a local open-weight model for incident analysis.","summary":"Hugging Face describes a reported agent intrusion, the affected systems and its incident response."},
 anthropic:{"format":"SEC filing","title":"Anthropic · The $80.7bn loss, in its S-1","date":"October 26, 2026 · H1 2026 financials","url":"https://www.sec.gov/Archives/edgar/data/2130357/000162828026067168/anthropicpbc-sx1.htm","note":"The S-1 reports a net loss of $80.748bn for the six months ended June 30, 2026, including a $72.388bn fair-value charge on convertible notes, derivative liabilities and SAFEs. Operating loss was $693m. These are different accounting measures, not an $80.7bn cash-burn figure. The earlier $42bn headline covered full-year 2025, so the periods differ. The filing does not establish that losses caused Anthropic’s policy advocacy.","summary":"Anthropic’s IPO filing reports an $80.7bn first-half net loss, largely driven by financing-related accounting charges."},
 anthropicpolicy:{"format":"Policy proposal","title":"Anthropic · Government power to block unsafe AI","date":"June 2026","url":"https://www.anthropic.com/policy-on-the-ai-exponential","note":"Anthropic’s Advanced AI Framework proposes stronger oversight as model capabilities increase, including independent evaluation and government authority to block or deter dangerous deployments. This is the company’s policy proposal, not enacted law or evidence that every open model would be covered.","summary":"Anthropic proposes escalating oversight and government authority to block or deter dangerous AI deployments."},
 anthropicpace:{"format":"Essay","title":"Dario Amodei · We Must Pace the Frontier","date":"September 2026","url":"https://darioamodei.com/post/we-must-pace-the-frontier","note":"Amodei proposes embedded third-party evaluators, coordination among frontier companies in democracies and wider international coordination. He advocates regulation and government support for some industry coordination. His stated rationale is allowing safeguards to keep pace with capabilities; the essay is not evidence that commercial motives are absent or that regulatory capture has occurred.","summary":"Amodei calls for outside evaluators and coordinated limits on AI progress so safeguards can keep pace."},
 anthropicroadmap:{"format":"Policy update","title":"Anthropic · October’s evaluator and pacing agenda","date":"October 19, 2026","url":"https://www.anthropic.com/responsible-scaling-policy/updates","note":"The October 19 update adds two policy goals: a proposal on embedded third-party evaluators due December 15, 2026, and a framework for targeting the pace of AI development due January 15, 2027. These are announced future proposals, not completed rules or binding regulation. See the section titled A roadmap for policymakers.","summary":"Anthropic adds dated goals for policy proposals on embedded evaluators and the pace of AI development."},
 index:{"format":"Website","title":"Index Network · product overview","date":"Checked October 27, 2026","url":"https://index.network/","note":"Index describes a social layer between personal agents, organized around intent creation, discovery and negotiation, then outcomes and learning. This describes the product’s proposition, not independently tested outcomes.","summary":"Index outlines a social layer where personal agents discover shared interests, negotiate and coordinate on behalf of users."},
 ledger:{"format":"Statement","title":"Ledger · response to hardware implant attack","date":"October 15, 2026","url":"https://www.ledger.com/blog-response-hardware-implant-attack","note":"Ledger says genuine devices were modified after distribution to capture recovery phrases during setup. It describes tighter reseller handling rules. Claims about the scope and cause are the vendor’s account.","summary":"Ledger explains its account of modified hardware wallets reaching users through distribution and its response to the attack."},
 trezor:{"format":"Report","title":"Trezor reseller response · reported by Decrypt","date":"October 2026","url":"https://decrypt.co/380848/trezor-cuts-its-resellers-ledger-finds-spy-implant-crypto-wallets","note":"Reporting reproduces Trezor’s announcement of a preventive reduction in resellers and its statement that it had no evidence Trezor devices were compromised. The original October 13 X post could not be directly inspected during preparation.","summary":"Decrypt covers Trezor’s preventive reduction in resellers following the reported Ledger hardware implant attack."},
 dhh:{"format":"Essay","title":"DHH · Over my dead pencil","date":"October 6, 2026","url":"https://world.hey.com/dhh/over-my-dead-pencil-fb0f3647","note":"DHH’s follow-up to his Rails World keynote argues that agents change the economics of hand-written code. This is his assessment and forecast, not a measured result for all software teams.","summary":"DHH argues that coding agents are changing the economics of writing software by hand."},
 keynote:{"format":"Video","title":"Rails World 2026 · DHH keynote · 58:30","date":"September 23, 2026","url":"https://www.youtube.com/watch?v=vDjW_dRyKXY&t=3510s","note":"The link starts at 58:30. The keynote is the source for the brainstorm’s DHH / Rust reference. Use the talk to examine how agent-assisted implementation changes language choices and the work of a developer.","summary":"Starting at 58:30, DHH’s Rails World keynote explores AI agents, Rust and the changing work of developers."},
 muse:{"format":"Announcement","title":"Meta · Introducing Muse","date":"September 8, 2026","url":"https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent","note":"Meta describes a personal agent with a dedicated cloud computer, connected services, user-selected access and approvals for sensitive actions. These are launch claims, not an independent reliability assessment.","summary":"Meta introduces Muse as a personal agent with a cloud computer, connected services and controls over sensitive actions."},
 dots:{"format":"Announcement","title":"OpenAI · Introducing dots","date":"September 29, 2026","url":"https://openai.com/index/introducing-dots/","note":"OpenAI describes always-on agents with cloud computers, app connections and ongoing responsibilities between conversations. The announcement emphasizes learning user preferences and making progress over time.","summary":"OpenAI introduces agents that remember preferences and carry out ongoing responsibilities between conversations."},
 grok:{"format":"Announcement","title":"xAI · Introducing Grok Bot","date":"August 11, 2026","url":"https://x.ai/news/introducing-grok-bot","note":"xAI presents persistent agents that remember context, use tools and coordinate across work such as sales, operations and engineering. Treat the announcement as a product proposition.","summary":"xAI presents persistent agents that remember context, use tools and coordinate work across business functions."},
 amazon:{"format":"Statement","title":"Amazon · statement on Perplexity Comet","date":"November 4, 2025","url":"https://www.aboutamazon.com/news/company-news/amazon-perplexity-comet-statement","note":"Amazon argued that agents should identify themselves and respect a service’s decision to participate. This source establishes Amazon’s position in the historical dispute, not the current legal outcome.","summary":"Amazon argues that shopping agents should identify themselves and respect a service’s decision to participate."},
 perplexity:{"format":"Statement","title":"Perplexity · Bullying Is Not Innovation","date":"November 4, 2025","url":"https://www.perplexity.ai/en-GB/hub/blog/bullying-is-not-innovation","note":"Perplexity framed Comet as a user-chosen representative and defended the freedom to delegate shopping. Read alongside Amazon’s position rather than treating either party’s claims as a legal finding.","summary":"Perplexity defends Comet as a user-chosen representative and argues for the freedom to delegate online shopping."},
 optimism:{"format":"Essay","title":"DHH · Endless execution","date":"August 9, 2026","url":"https://world.hey.com/dhh/endless-execution-4157e065","note":"DHH’s optimistic account of using AI agents to turn more ideas into working experiments. It describes his experience and enthusiasm, not a controlled productivity study.","summary":"DHH makes an optimistic case for AI agents turning more ideas into practical experiments."},
 devicechecks:{"format":"Guide","title":"Trezor · Is my device safe to use?","date":"Support guide · checked October 27, 2026","url":"https://trezor.io/support/troubleshooting/device-issues/is-my-device-safe-to-use","note":"The manufacturer explains model-specific packaging and device checks. Useful for examining what an ordinary user can verify; these checks are not proof that every supply-chain risk is eliminated.","summary":"Trezor describes packaging and device checks that buyers can use to assess a hardware wallet."},
 indexfield:{"format":"Field report","title":"Index · Can agents be trusted?","date":"July 29, 2026","url":"https://index.network/blog/can-agents-be-trusted","note":"Index’s own account of the Agent Village experiment at Edge Esmeralda, including introductions and negotiation outcomes. A concrete field example, with results reported by the project itself.","summary":"Index reports on Agent Village, a field experiment in agent-mediated introductions and negotiation at Edge Esmeralda."},
 a2a:{"format":"Protocol","title":"Google · Agent2Agent explained","date":"April 9, 2025","url":"https://developers.googleblog.com/a2a-a-new-era-of-agent-interoperability/","note":"The A2A introduction describes communication between agents from different providers. Broader interoperability context; this source does not establish that Index implements A2A.","summary":"Google introduces a protocol for communication and collaboration between agents from different providers."},
 ap2:{"format":"Protocol","title":"Google · Agent Payments Protocol","date":"September 2025","url":"https://cloud.google.com/blog/products/ai-machine-learning/announcing-agents-to-payments-ap2-protocol","note":"AP2 proposes verifiable mandates for user intent and purchases across payment methods. It is an authorization framework, not itself a settlement network or a guarantee of correct agent decisions.","summary":"Google proposes verifiable mandates for authorizing agent purchases and recording user intent across payment methods."},
 osidef:{"format":"Definition","title":"OSI · What counts as open-source AI?","date":"Definition 1.0 · October 2024","url":"https://opensource.org/ai/open-source-ai-definition","note":"The Open Source Initiative’s definition distinguishes meaningful freedoms and access to components from merely downloadable weights. A standard to examine alongside the summit’s use of the term open.","summary":"The Open Source Initiative defines the freedoms and access to components that qualify a system as open-source AI."},
 nistir:{"format":"Standard","title":"NIST · What incident response should cover","date":"April 2025","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final","note":"NIST SP 800-61 Rev. 3 covers incident response within cybersecurity risk management. A framework for evaluating response quality; it does not corroborate the Hugging Face incident.","summary":"NIST provides a framework for preparing for, responding to and recovering from cybersecurity incidents."},
 aicyber:{"format":"Disclosure","title":"Anthropic · A separate AI cyber case","date":"November 2025","url":"https://www.anthropic.com/news/disrupting-AI-espionage","note":"Anthropic’s account of a different, September 2025 espionage campaign. Compare evidence and attribution methods across disclosures; this is not additional evidence about Hugging Face.","summary":"Anthropic describes a separate reported AI-assisted espionage campaign, offering another example of incident evidence and attribution."},
 l402:{"format":"Docs","title":"Lightning Labs · L402 payments for APIs","date":"Documentation · checked October 27, 2026","url":"https://docs.lightning.engineering/the-lightning-network/l402","note":"Developer documentation explains paying for access to digital resources using Lightning invoices and authentication tokens. A concrete Bitcoin payment mechanism to compare against other options.","summary":"Lightning Labs explains how Lightning invoices and authentication tokens can enable paid access to APIs and digital resources."},
 albybudget:{"format":"Guide","title":"Alby · Set a budget for each app","date":"Documentation · checked October 27, 2026","url":"https://guides.getalby.com/user-guide/alby-hub/faq/how-can-i-check-budgets-of-connected-apps","note":"Alby documents per-application spending budgets for connected apps. A practical example of limiting delegated spending, not a claim that a budget makes every transaction safe.","summary":"Alby shows how to set and review spending budgets for individual apps connected to a Lightning wallet."},
 spiralpayments:{"format":"Report · GitHub","title":"Spiral · The Long Road to Bitcoin Payments","date":"Living report · checked October 27, 2026","url":"https://github.com/spiralxyz/bitcoin-payments","note":"Spiral’s living report argues that demand and incentives remain obstacles despite better infrastructure. It invites evidence and moonshot proposals; it is not a payment SDK or an adoption forecast. Its distinction between spending bitcoin and routing other currencies over Bitcoin infrastructure matters for evaluating success.","summary":"Spiral examines barriers to Bitcoin payments and invites ideas that could turn improved infrastructure into everyday use."},
 stripempp:{"format":"Announcement","title":"Stripe · Machine Payments Protocol","date":"March 18, 2026","url":"https://stripe.com/blog/machine-payments-protocol","note":"Stripe and Tempo introduce MPP, an open standard for programmatic payments between agents and services. Stripe’s implementation supports stablecoins and fiat payment methods. This is a concrete alternative for agent commerce, not proof that every agent or merchant prefers those rails.","summary":"Stripe introduces a protocol for agents to pay services programmatically using stablecoins and supported fiat payment methods."},
 shopifyusdc:{"format":"Announcement","title":"Shopify · USDC at checkout","date":"June 12, 2025","url":"https://www.shopify.com/news/stablecoins-on-shopify","note":"Shopify’s original announcement describes USDC payments on Base through existing merchant checkout flows, with local-currency settlement by default or a USDC option. This provides a historical integration example, not a current adoption-volume estimate or a guarantee that all merchants offer it.","summary":"Shopify announces USDC checkout with Coinbase and Stripe, showing how stablecoins can enter existing merchant payment flows."},
 conoraddresses:{"format":"Essay","title":"Conor Okus & Mat Balez · Making Bitcoin Speak Human","date":"December 11, 2025","url":"https://spiralxyz.substack.com/p/making-bitcoin-speak-human","note":"Okus and Balez describe human-readable Bitcoin addresses using BIP 353 and DNS, intended to make payment addressing more familiar. This is supporting context on payment usability, not a claim that addressing alone solves demand or that every wallet supports the standard.","summary":"Conor Okus and Mat Balez explain how human-readable addresses could make Bitcoin payments more familiar and easier to use."},
 amazonletter:{"format":"Letter · PDF","title":"Amazon · The original demand letter","date":"October 31, 2025","url":"https://assets.aboutamazon.com/2d/47/6801224e4607900ef4e61a80a319/2025-10-31-amazon-cease-desist-ltr-to-perplexity.pdf","note":"Amazon’s original letter demands that Perplexity stop obscuring agent activity and respect Amazon’s participation decisions. The letter records allegations and demands from one party, not court findings or the dispute’s current outcome.","summary":"Amazon’s original demand letter sets out its allegations and asks Perplexity to stop obscuring agent activity."},
 summitreport:{"format":"Overview · PDF","title":"AI Summit · It’s Time to Hit the Gas","date":"Post-summit overview · October 2026","url":"https://opensourceaisummit.org/report/open-source-ai-hit-the-gas.pdf","note":"The organizers’ five priorities are an advocacy agenda, not evidence of unanimous speaker agreement. The on-screen list paraphrases the report.","summary":"Five priorities connect public awareness, policy, security, deeper transparency and community growth."},
 lnagents:{"format":"Launch + code","title":"Lightning Labs · Tools for paying agents","date":"February 11, 2026","url":"https://lightning.engineering/posts/2026-02-11-ln-agent-tools/","note":"The release introduces lnget and agent skills for Lightning payments, scoped credentials and remote signing. It establishes available developer tooling; it does not establish widespread adoption, universal safety or the superiority of one payment rail.","summary":"Lightning Labs releases tools for agent payments, including scoped credentials, remote signing and paid resource access."},

  {"id":"dhh","overview":"DHH argues that AI agents change the economics of writing software. His keynote and follow-up essays ask what becomes worth building when execution gets cheaper.","focusLabel":"DHH","label":"DHH & the Cost of Code","type":"Speaker’s thesis","date":"Rails World · September 2026","title":"If the agent writes it, why not Rust?","body":"DHH’s Rails World keynote put AI agents and Rust at the center of a discussion about software’s future. His follow-up argues that the economics of hand-written code are changing. The room can test that thesis.","questions":["What does DHH’s argument change about how you judge the value of writing code?","What would make you reject code that works but you cannot explain?","What new project becomes practical, and how would you verify it?"],"nudges":["Where does DHH’s optimism match what you have actually built with agents?","Where should the standard differ between a prototype and a wallet?","Name the part that got cheaper and the part that did not."],"evidence":["keynote","dhh","optimism"],"caveat":"A speaker’s position and experience, not proof that handwritten code or a particular framework is obsolete.","quotes":[{"text":"Don't go down with the pencils. There's so much to build. We need you.","source":"dhh"},{"text":"I feel like there's a little genie trapped in my machine now. There to fulfill every wish and every whim. It's taken months to internalize just what liberation this grants those with the ambition to imagine.","source":"optimism"}],"preview":{"image":"dhh.jpg","source":"keynote","caption":"Keynote · 58:30","alt":"Rails World 2026 opening keynote by DHH","kind":"video"}},
  {"id":"perception","overview":"Karpathy sees a widening gap between trying AI and working deeply with it. Levie and Ball ask why stronger models do not automatically translate into useful everyday experiences.","focusLabel":"Karpathy","label":"Karpathy & the AI Perception Gap","type":"Industry discussion","date":"October 11–16, 2026","title":"The same AI moment. Very different experiences.","body":"Karpathy argues that the gap between casual AI users and people working deeply with frontier tools is widening. Aaron Levie and Jamin Ball extend the discussion: better models alone do not guarantee that people can put them to work.","questions":["Why does AI feel transformative to some people and underwhelming to others?","How much of that gap comes from the models, and how much from access, skills or what people ask them to do?","What would you build to give someone their first genuinely useful experience with AI?"],"nudges":["Compare a moment when AI changed your work with one when it disappointed you.","Which barrier could a better product remove, and which needs something else?","Pick a person and a real task. What would make the benefit obvious?"],"evidence":["karpathygap","leviegap","diffusiongap"],"caveat":"This is an October 2026 discussion about differing experiences and adoption, not a measured distribution of ability. Karpathy labels his population estimates as napkin math; they are deliberately omitted here. Levie and Ball offer interpretations, not independent verification. The thumbnail is a conceptual illustration with no quantitative scale.","preview":{"image":"perception.svg","source":"karpathygap","caption":"Karpathy · October 11","alt":"Conceptual illustration of a gap between trying AI and using it deeply; not a data chart","fit":"contain"}},
  {"id":"loupe","overview":"Loupe and Bitcoin Red Team volunteers use AI to find and address software flaws. Eclair’s October release offers a concrete example of that work reaching security fixes.","focusLabel":"Loupe","label":"Loupe & Bitcoin’s Red Team","type":"Security tooling & community response","date":"August–October 2026","title":"Bitcoin’s defenders are putting AI to work.","body":"Spiral and Block’s Loupe scans open-source Bitcoin code. Rob Hamilton, Calle and other Bitcoin Red Team volunteers are also using AI to hunt bugs and coordinate disclosures after the Coldcard incident. Eclair’s October release credits Loupe and researcher Erick Cestari for security fixes. Hamilton’s October interview describes the wider effort.","questions":["Could AI make open-source software safer faster than it makes attacks cheaper?","When finding bugs gets cheap, what becomes the hard part of keeping Bitcoin secure?","What would you build to turn a volunteer security sprint into lasting protection for Bitcoin?"],"nudges":["What do Loupe and the Red Team suggest about the advantage a small group of defenders can gain?","Confirming findings, reaching maintainers, funding review or getting fixes into users’ hands?","Choose one gap in the path from finding to fix, a maintainer to help and a 30-day experiment."],"evidence":["loupe","louperepo","robredteam","robinterview","eclairsecurity"],"caveat":"Project Loupe and the volunteer Bitcoin Red Team are related examples of defensive AI work, not presented here as one organization. Hamilton and Calle’s effort includes many other contributors. Hamilton’s posts and interview are first-person accounts; scan findings and severity labels are not equivalent to independently confirmed, exploitable vulnerabilities. Eclair’s maintainer-authored release notes provide a concrete example of Loupe-related work reaching fixes. The Coldcard incident concerned wallet software, not a demonstrated break of Bitcoin’s consensus or cryptography.","previ const themeStorageKey='builder-roundtable-theme-v1';
let currentTheme=document.documentElement.dataset.theme==='day'?'day':'night';
const themeArtwork={
 day:{src:'../../dist/assets/satoshi-marble-day.png',alt:'Imagined Satoshi marble bust in a sunlit courtyard with white columns, blue water and coral trees.'},
 night:{src:'../../dist/assets/satoshi-marble-wide.png',alt:'Imagined Satoshi as a hooded marble statue in cyan and pink light.'}
};
function applyTheme(theme,save=false){
 currentTheme=theme==='day'?'day':'night';
 document.documentElement.dataset.theme=currentTheme;
 document.querySelector('meta[name="theme-color"]').content=currentTheme==='day'?'#f6f5ef':'#0b0d18';
 document.querySelectorAll('.theme-switch button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.theme===currentTheme)));
 const hero=document.querySelector('.hero-art');
 if(hero){const art=themeArtwork[currentTheme];if(hero.getAttribute('src')!==art.src)hero.src=art.src;hero.alt=art.alt;}
 if(save){try{localStorage.setItem(themeStorageKey,currentTheme);}catch{toast('Theme changed. This browser could not save the preference.');}}
}
window.addEventListener('storage',event=>{if(event.key===themeStorageKey)applyTheme(event.newValue);});
const showcaseSourceIds=['voraSponsor','spiralSponsor','hoseki'];
const frameCorners='<span class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';

  return source?`<a class="source-preview" href="${esc(source.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(source.title)}: open ${esc(preview.kind==='video'?'video':'source')} in a new tab">${visual}</a>`:`<figure class="source-preview preview-concept">${visual}</figure>`;
}
function topicHeading(t,focused=false){return `<div class="topic-heading"><div><div class="eyebrow accent">${['I','II','III','IV','V'][topicIndex]} / ${esc(t.word)}${focused?' / Focus':''}</div><h1 id="topic-title" tabindex="-1">${esc(focused?currentCase().label:t.title)}</h1></div>${focused?'<button class="overview-back" data-action="overview">← All three topics</button>':''}</div>`;}
function renderTopic(){
  const t=currentTopic();
  if(focusedCaseId){renderFocusedTopic();return;}
  app.innerHTML=`${sectionNav()}<section class="topic-shell topic-overview" aria-labelledby="topic-title">
    ${topicHeading(t)}
    <div class="topic-overview-grid">${t.cases.map((c,i)=>`<article class="overview-card" aria-labelledby="card-${esc(c.id)}">
      <div class="overview-card-top"><span class="overview-numeral" aria-hidden="true">${['I','II','III'][i]}</span>${sourcePreview(c)}</div>
      <h2 id="card-${esc(c.id)}">${esc(c.label)}</h2>
      <p class="overview-summary">${esc(c.overview||c.body)}</p>
      <p class="overview-question">${esc(c.questions[0])}</p>
      <div class="overview-card-bottom">
        ${sourceLinks(c,c.evidence.slice(0,3),`Top three sources for ${c.label}`)}
        <button class="overview-focus" data-action="case" data-id="${esc(c.id)}" aria-label="Focus ${esc(c.focusLabel||c.label)}"><span>Focus ${esc(c.focusLabel||c.label)}</span><span aria-hidden="true">↗</span></button>
      </div>
    </article>`).join('')}</div>
  </section>`;
}
function renderFocusedTopic(){
  const t=currentTopic(),c=currentCase();
  app.innerHTML=`${sectionNav()}<section class="topic-shell topic-focus" aria-labelledby="topic-title">
    ${topicHeading(t,true)}
    <div class="discussion">
        <article class="context">
          <div class="case-meta"><span class="case-type">${c.type}</span><span>${c.date}</span></div>
          <div class="context-heading"><h2>${c.title}</h2>${sourcePreview(c)}</div>
          <p class="capsule">${c.body}</p>
          ${c.quotes?.length?`<div class="context-quotes" aria-label="In DHH’s words">${c.quotes.map(quote=>{const source=sources[quote.source];return `<figure class="context-quote"><blockquote cite="${esc(source.url)}"><p>“${esc(quote.text)}”</p></blockquote><figcaption><cite><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.title)} <span aria-hidden="true">↗</span></a></cite></figcaption></figure>`;}).join('')}</div>`:''}
          ${c.takeaways?.length?`<section class="summit-takeaways" aria-labelledby="takeaways-title"><h3 id="takeaways-title" class="eyebrow">Five Priorities From the Summit</h3><ol>${c.takeaways.map(point=>`<li><strong>${esc(point.title)}.</strong> <span>${esc(point.body)}</span></li>`).join('')}</ol></section>`:''}
          ${c.discussionPoints?.length?`<ul class="discussion-points">${c.discussionPoints.map(point=>`<li>${esc(point)}</li>`).join('')}</ul>`:''}
          ${sourceLinks(c)}
          ${c.risks?.length?`<section class="risk-sources" aria-labelledby="risk-title"><h3 id="risk-title" class="eyebrow">Risks</h3>${sourceLinks(c,c.risks,`Risks and access terms for ${c.title}`)}</section>`:''}
        </article>
      <article class="question-card topic-focus-questions" aria-label="Discussion prompts">${frameCorners}
        ${c.questions.map((question,i)=>`<section class="focus-prompt${i===0?' focus-prompt-opening':''}" aria-labelledby="focus-question-${i}">
          <div class="eyebrow">${['Starting Point','Bigger Questions','Build Opportunities'][i]}</div>
          <h2 id="focus-question-${i}">${esc(question)}</h2>
          <p class="focus-nudge">${esc(c.nudges[i])}</p>
        </section>`).join('')}
      </article>
    </div>
    <div class="discussion-footer"><p class="context-primer"><span class="eyebrow">In plain language</span>${esc(t.term)}</p></div>
  </section>`;
}
function openCase(id){
  if(view!=='topic'||!currentTopic().cases.some(c=>c.id===id))return;
  focusedCaseId=id;
  state.selected[currentTopic().id]=id;
  persist();render();
  window.scrollTo(0,0);
  app.querySelector('#topic-title')?.focus({preventScroll:true});
}
function showOverview(){
  const previous=focusedCaseId;
  focusedCaseId=null;render();
  const button=app.querySelector(`[data-action="case"][data-id="${previous}"]`);
  button?.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function renderRoom(){const closing=view==='closing',key=closing?'after':'before',value=state.mood[key];app.innerHTML=`<section class="room"><div class="room-head"><span class="eyebrow accent">${closing?'Back to where we started':'Before we begin'} / A show of hands</span><button class="text-link" data-action="map">← Discussion map</button></div><h1>${closing?'What changed your <span class="serif">mind?</span>':'How are we<br><span class="serif">feeling?</span>'}</h1><p class="room-prompt">${closing?'Which example shifted your view? What is one thing you want to test next?':'AI, Bitcoin, and the next few years. Where do you land, and what is driving that feeling?'}</p><div class="spectrum-labels"><span>“It’s so over.”</span><span>“We’re so back.”</span></div><div class="spectrum" role="group" aria-label="Room sentiment">${moodLabels.map((label,i)=>`<button class="${value===i?'selected':''}" data-action="mood" data-index="${i}" aria-pressed="${value===i}"><span class="dot" aria-hidden="true"></span>${label}</button>`).join('')}</div><p class="room-caption">A shared impression of the room · no votes are counted. Select again to clear.</p><div class="room-bottom"><div class="comparison">${closing?(state.mood.before===null?'Opening mood wasn’t recorded.':`We started: <strong>${moodLabels[state.mood.before]}</strong>`) +(value!==null?` &nbsp;→&nbsp; Now: <strong>${moodLabels[value]}</strong>`:''):'Invite one hopeful voice, one skeptical voice, and someone in between.'}</div><button class="primary" data-action="map">${closing?'Back to the discussion':'Choose our first question'} <span class="arrow">↗</span></button></div>${closing?`<div class="closing-prompts"><div class="eyebrow">One insight. One unresolved question. One experiment.</div></div>`:''}</section>`;}
function navigate(next,index){
  view=next;
  try{history.replaceState(null,'',location.pathname+location.search+(['links','showcase'].includes(next)?'#'+next:''));}catch{}
  focusedCaseId=null;
  if(next==='topic'){
    topicIndex=Math.max(0,Math.min(4,index));
    const id=currentTopic().id;
    if(!state.visited.includes(id))state.visited.push(id);
    persist();
  }
  render();
  window.scrollTo(0,0);
}
function openDialog(title,html){restoreFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;if(!dialog.open)dialog.showModal();dialog.scrollTop=0;}
function focusSources(){const link=app.querySelector('.source-link');if(link){link.focus();link.scrollIntoView({block:'nearest'});}}
function help(){openDialog('Follow the discussion.',`<p>Each area opens with three topics and three source links per topic. Choose Focus for the full context, all sources and discussion prompts. Return to the overview whenever the room changes direction.</p><div class="key-list"><span><kbd>M</kbd></span><span>Return to the discussion map</span><span><kbd>1</kbd> – <kbd>5</kbd></span><span>Open a discussion area’s overview</span><span><kbd>6</kbd></span><span>Open the showcase</span><span><kbd>7</kbd></span><span>Open all links</span><span><kbd>E</kbd></span><span>Focus the first source link on the page</span><span><kbd>F</kbd></span><span>Toggle fullscreen</span><span><kbd>Esc</kbd></span><span>Return from Focus to the three-topic overview</span></div>`);}

async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Use your browser’s fullscreen command.');}catch{toast('Use your browser’s fullscreen command.');}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,index=Number(b.dataset.index);switch(a){case'theme':applyTheme(b.dataset.theme,true);break;case'map':navigate('map');break;case'links':navigate('links');break;case'showcase':navigate('showcase');break;case'topic':navigate('topic',index);break;case'case':openCase(b.dataset.id);break;case'overview':showOverview();break;case'opening':navigate('opening');break;case'closing':navigate('closing');break;case'mood':{const key=view==='closing'?'after':'before';state.mood[key]=state.mood[key]===index?null:index;persist();render();break;}case'help':help();break;case'close-dialog':dialog.close();break;case'fullscreen':fullscreen();break;}});
dialog.addEventListener('close',()=>{restoreFocus?.isConnected&&restoreFocus.focus();});
document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'↙ Exit fullscreen':'⛶ Fullscreen';document.getElementById('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(dialog.open)return;const k=e.key.toLowerCase();if(k==='m')navigate('map');else if(k==='6')navigate('showcase');else if(k==='7')navigate('links');else if(/^[1-5]$/.test(k))navigate('topic',Number(k)-1);else if(k==='f')fullscreen();else if(k==='?')help();else if(view==='topic'){if(k==='e')focusSources();else if(k==='escape'&&focusedCaseId){e.preventDefault();showOverview();}}});
window.addEventListener('storage',event=>{if(event.key!==storageKey)return;try{const incoming=JSON.parse(event.newValue);if(incoming&&Array.isArray(incoming.visited)){state={...defaults(),...incoming};render();}}catch{}});
window.addEventListener('hashchange',()=>{view=hashView();focusedCaseId=null;render();window.scrollTo(0,0);});
applyTheme(currentTheme);render();
</script>
</body>
</html>
